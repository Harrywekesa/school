<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Status - Primary School</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Fee Status - Primary School</h1>
        <nav>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
            <ul id="nav-menu">
                <li><a href="admin_dashboard.html">Home</a></li>
                <li><a href="student_admission.html">Student Admission</a></li>
                <li><a href="fee_setup.html">Setup Fees</a></li>
                <li><a href="fee_status.html">Fee Status</a></li>
                <li><a href="generate_reports.html">Generate Reports</a></li>
                <li><a href="logout.php">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Fee Status</h2>
            <table>
                <thead>
                    <tr>
                        <th>Admission Number</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Fee Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="fee-status-table-body">
                    <!-- Data will be dynamically loaded here -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('fee_status.php')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('fee-status-table-body');
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.student_id}</td>
                            <td>${row.first_name} ${row.middle_name} ${row.last_name}</td>
                            <td>${row.class_admitted}</td>
                            <td>${row.fee_amount}</td>
                            <td>${row.status}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                })
                .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
