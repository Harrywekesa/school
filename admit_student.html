<form id="admission-form" action="admit_student.php" method="post">
    <label for="first_name">First Name:</label>
    <input type="text" id="first_name" name="first_name" required><br>

    <label for="middle_name">Middle Name:</label>
    <input type="text" id="middle_name" name="middle_name"><br>

    <label for="last_name">Last Name:</label>
    <input type="text" id="last_name" name="last_name" required><br>

    <label for="class_admitted">Class Admitted to:</label>
    <select id="class_admitted" name="class_admitted" required>
        <option value="Class 1">Class 1</option>
        <option value="Class 2">Class 2</option>
        <option value="Class 3">Class 3</option>
        <!-- Add more options for different classes -->
    </select><br>

    <label for="emergency_contact_name">Emergency Contact Name:</label>
    <input type="text" id="emergency_contact_name" name="emergency_contact_name" required><br>

    <label for="emergency_contact_phone">Emergency Contact Phone:</label>
    <input type="text" id="emergency_contact_phone" name="emergency_contact_phone" required><br>

    <label for="emergency_contact_email">Emergency Contact Email:</label>
    <input type="email" id="emergency_contact_email" name="emergency_contact_email" required><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" required><br>

    <button type="submit">Admit Student</button>
</form>
