    <link rel="stylesheet" href="css/styles.css">
    <script src="script/session_reporting.js" defer></script>
</head>
<body>
    <header>
        <h1>Session Reporting - Primary School</h1>
        <nav>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
            <ul id="nav-menu">
                <li><a href="admin_dashboard.html">Home</a></li>
                <li><a href="student_admission.html">Student Admission</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Create Academic Session</h2>
            <form id="session-form">
                <label for="year">Year:</label>
                <input type="number" id="year" name="year" required>
                <label for="term">Term:</label>
                <select id="term" name="term" required>
                    <option value="1">Term 1</option>
                    <option value="2">Term 2</option>
                    <option value="3">Term 3</option>
                </select>
                <button type="submit">Create Session</button>
            </form>
        </section>
        <section>
            <h2>Session Reports</h2>
            <form id="report-form">
                <label for="report-year">Select Year:</label>
                <input type="number" id="report-year" name="report_year" required>
                <label for="report-term">Select Term:</label>
                <select id="report-term" name="report_term" required>
                    <option value="1">Term 1</option>
                    <option value="2">Term 2</option>
                    <option value="3">Term 3</option>
                </select>
                <button type="submit">Generate Report</button>
            </form>
            <div id="report-result" class="hidden">
                <h3>Report Result</h3>
                <div id="report-content"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
</body>
</html>
