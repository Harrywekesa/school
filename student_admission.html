<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission - Primary School</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Primary School</h1>
    <nav>
      <ul id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
      <button id="menu-toggle" aria-label="Toggle menu">☰</button>
    </nav>
  </header>
  <main>
    <section>
      <h2>Student Admission</h2>
      <p>Welcome to the student admission portal for Primary School.</p>
      <form id="admission-form" action="admit_student.php" method="post" enctype="multipart/form-data">
        <div class="form-row">
          <label for="first_name">First Name:</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-row">
          <label for="middle_name">Middle Name:</label>
          <input type="text" id="middle_name" name="middle_name">
        </div>
        <div class="form-row">
          <label for="last_name">Last Name:</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="form-row">
          <label for="class_admitted">Class Admitted to:</label>
          <select id="class_admitted" name="class_admitted" required>
            <option value="Class 1">Class 1</option>
            <option value="Class 2">Class 2</option>
            <option value="Class 3">Class 3</option>
          </select>
          <button type="button" id="add-class-btn">Add More Classes</button>
        </div>
        <div class="form-row">
          <label for="emergency_contact_name">Emergency Contact Name:</label>
          <input type="text" id="emergency_contact_name" name="emergency_contact_name" required>
        </div>
        <div class="form-row">
          <label for="emergency_contact_phone">Emergency Contact Phone:</label>
          <input type="text" id="emergency_contact_phone" name="emergency_contact_phone" required>
        </div>
        <div class="form-row">
          <label for="emergency_contact_email">Emergency Contact Email:</label>
          <input type="email" id="emergency_contact_email" name="emergency_contact_email" required>
        </div>
        <div class="form-row">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" required>
        </div>
        <div class="form-row">
          <label for="student_photo">Student Photo (Optional):</label>
          <br>
          <input type="file" id="student_photo" name="student_photo" accept="image/*">
        </div>
        <button type="submit">Admit Student</button>
      </form>
      <p id="admission-success" class="hidden">Student admission successful!</p>
    </section>
  </main>
  <footer>
    <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
  </footer>
</body>
</html>
