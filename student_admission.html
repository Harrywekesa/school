<body>
    <header>
        <h1>Student Admission - Primary School</h1>
        <nav>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
            <ul id="nav-menu">
                <li><a href="admin_dashboard.html">Home</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Student Admission Form</h2>
            <form id="admission-form" action="student_admission.php" method="post" enctype="multipart/form-data">
               <!--- <div class="form-row">
                    <label for="admission_number">Admission Number:</label>
                    <input type="text" id="admission_number_display" name="admission_number_display" readonly>
                </div>-->
                <div class="form-row">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div class="form-row">
                    <label for="middle_name">Middle Name:</label>
                    <input type="text" id="middle_name" name="middle_name">
                </div>
                <div class="form-row">
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
                <div class="form-row">
                    <label for="birth_certificate_number">Birth Certificate Number:</label>
                    <input type="text" id="birth_certificate_number" name="birth_certificate_number" required>
                </div>
                <div class="form-row">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="class_admitted">Class Admitted:</label>
                    <select id="class_admitted" name="class_admitted" required>
                        <option value="Grade 1">Grade 1</option>
                        <option value="Grade 2">Grade 2</option>
                        <option value="Grade 3">Grade 3</option>
                        <!-- Add more classes as needed -->
                    </select>
                </div>
                <div class="form-row">
                    <label for="emergency_contact_name">Emergency Contact Name:</label>
                    <input type="text" id="emergency_contact_name" name="emergency_contact_name" required>
                </div>
                <div class="form-row">
                    <label for="emergency_contact_phone">Emergency Contact Phone:</label>
                    <input type="text" id="emergency_contact_phone" name="emergency_contact_phone" required>
                </div>
                <div class="form-row">
                    <label for="emergency_contact_email">Emergency Contact Email:</label>
                    <input type="email" id="emergency_contact_email" name="emergency_contact_email" required>
                </div>
                <div class="form-row">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required>
                </div>
                <div class="form-row">
                    <label for="admission_date">Admission Date:</label>
                    <input type="date" id="admission_date" name="admission_date" required>
                </div>
                <div class="form-row">
                    <label for="admitted_by">Admitted By (ID):</label>
                    <input type="number" id="admitted_by" name="admitted_by" required>
                </div>
                <div class="form-row">
                    <label for="student_photo">Student Photo:</label>
                    <input type="file" id="student_photo" name="student_photo" accept="image/*">
                </div>
                <input type="hidden" id="admission_number" name="admission_number">
                <button type="submit" class="green-button">Submit</button>
            </form>
            <div id="admission-success" class="hidden">
                <p>Admission successfully completed!</p>
            </div>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
</body>
</html>
