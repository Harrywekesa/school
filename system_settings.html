<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Primary School</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/system_settings.js" defer></script>
</head>
<body>
    <header>
        <h1>System Settings - Primary School</h1>
        <nav>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
            <ul id="nav-menu">
                <li><a href="admin_dashboard.html">Home</a></li>
                <li><a href="system_settings.html">System Settings</a></li>
                <li><a href="manage_users.html">Manage Users</a></li>
                <li><a href="session_setup.html">Session Setup</a></li>
                <li><a href="logout.php">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>System Settings</h2>
            <form id="settings-form" action="save_settings.php" method="post" enctype="multipart/form-data">
                <div class="form-row">
                    <label for="institution_name">Institution Name:</label>
                    <input type="text" id="institution_name" name="institution_name" required>
                </div>
                <div class="form-row">
                    <label for="theme">Theme:</label>
                    <select id="theme" name="theme" required>
                        <option value="default">Default</option>
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="logo">School Logo:</label>
                    <input type="file" id="logo" name="logo" accept="image/*">
                </div>
                <div class="form-row">
                    <label for="contact_phone">Contact Phone:</label>
                    <input type="text" id="contact_phone" name="contact_phone" required>
                </div>
                <div class="form-row">
                    <label for="contact_email">Contact Email:</label>
                    <input type="email" id="contact_email" name="contact_email" required>
                </div>
                <div class="form-row">
                    <label for="vision">Vision:</label>
                    <textarea id="vision" name="vision" required></textarea>
                </div>
                <div class="form-row">
                    <label for="mission">Mission:</label>
                    <textarea id="mission" name="mission" required></textarea>
                </div>
                <button type="submit" class="green-button">Save Settings</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
</body>
</html>
