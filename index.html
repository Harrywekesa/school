<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary School</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="script/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Primary School</h1>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
        </nav>
    </header>
    <main>
        <section>
            <h2>Welcome to Our School</h2>
            <p>Providing quality education to young minds.</p>
        </section>
        <section id="announcements-section">
            <h2>Announcements</h2>
            <ul id="announcements-list">
                <!-- Announcements will be dynamically loaded here -->
            </ul>
        </section>
        <section id="events-section">
            <h2>Upcoming Events</h2>
            <ul id="events-list">
                <!-- Events will be dynamically loaded here -->
            </ul>
        </section>
        <section id="feedback-section">
            <h2>Feedback</h2>
            <form id="feedback-form" action="submit_feedback.php" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Submit</button>
            </form>
            <p id="feedback-success" class="hidden">Thank you for your feedback!</p>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
</body>
</html>
