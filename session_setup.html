<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Setup - Primary School</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/session_setup.js" defer></script>
</head>
<body>
    <header>
        <h1>Session Setup - Primary School</h1>
        <nav>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
            <ul id="nav-menu">
                <li><a href="admin_dashboard.html">Home</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Create Academic Session</h2>
            <form id="session-form">
                <div class="form-row">
                    <label for="year">Year:</label>
                    <input type="number" id="year" name="year" required>
                </div>
                <div class="form-row">
                    <label for="term">Term:</label>
                    <select id="term" name="term" required>
                        <option value="1">Term 1</option>
                        <option value="2">Term 2</option>
                        <option value="3">Term 3</option>
                    </select>
                </div>
                <button type="submit" class="green-button">Create Session</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
</body>
</html>
