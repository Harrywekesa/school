<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Entry - Primary School</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/marks_entry.js" defer></script>
</head>
<body>
    <header>
        <h1>Marks Entry - Primary School</h1>
        <nav>
            <button id="menu-toggle" aria-label="Toggle menu">☰</button>
            <ul id="nav-menu">
                <li><a href="admin_dashboard.html">Home</a></li>
                <li><a href="marks_entry.html">Marks Entry</a></li>
                <li><a href="logout.php">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Enter Marks</h2>
            <form id="marks-form">
                <div class="form-row">
                    <label for="year">Year:</label>
                    <select id="year" name="year" required>
                        <!-- Years will be dynamically loaded -->
                    </select>
                </div>
                <div class="form-row">
                    <label for="term">Term:</label>
                    <select id="term" name="term" required>
                        <option value="1">Term 1</option>
                        <option value="2">Term 2</option>
                        <option value="3">Term 3</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="class">Class:</label>
                    <select id="class" name="class" required>
                        <!-- Classes will be dynamically loaded -->
                    </select>
                </div>
                <div class="form-row">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <!-- Subjects will be dynamically loaded -->
                    </select>
                </div>
                <button type="button" class="green-button" onclick="loadStudents()">Load Students</button>
                <div id="students-container" class="hidden">
                    <!-- Students list will be dynamically loaded here -->
                </div>
                <button type="submit" class="green-button">Submit Marks</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Contact us: info@primaryschool.com | +1 234 567 890</p>
    </footer>
</body>
</html>
